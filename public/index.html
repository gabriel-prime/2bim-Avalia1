<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desenho Assinado</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Desenho Assinado</h1>
      <p>Escolha um número entre 1 e 100. O desenho é gerado no servidor e assinado com o e-mail da conta Google usada no login.</p>
    </header>

    <section id="login">
      <div id="g_id_onload"
           data-client_id="605108713249-bf10dv2gis3p3p0t4l1el772gemtgg7d.apps.googleusercontent.com"
           data-callback="aoEntrar"
           data-auto_prompt="false"></div>
      <div class="g_id_signin" data-type="standard" data-theme="filled_blue" data-text="signin_with" data-locale="pt-BR"></div>
    </section>

    <p id="identidade" hidden></p>

    <form id="formulario" novalidate>
      <label for="numero">Número</label>
      <input id="numero" name="numero" type="number" min="1" max="100" step="1" required placeholder="42">

      <button type="submit">Desenhar</button>
    </form>

    <p id="mensagem" role="alert"></p>

    <figure id="desenho" aria-live="polite"></figure>

    <button id="baixar" type="button" hidden>Baixar SVG</button>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
